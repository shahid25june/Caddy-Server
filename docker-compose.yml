# Edge proxy for every app on this server. Each site's routing lives in its own file under
# config/sites/ in this repository; see README.md for adding a site.
services:
  # Copies config/ from this repository into a volume, then exits.
  # Re-run it to pick up changes: docker start edge-caddy-config
  config:
    image: alpine/git:latest
    container_name: edge-caddy-config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -rf /tmp/repo
        git clone --depth 1 --branch "$${CONFIG_BRANCH}" "$${CONFIG_REPO}" /tmp/repo
        rm -rf /cfg/*
        cp -r /tmp/repo/config/. /cfg/
        echo "Caddy config updated to $$(git -C /tmp/repo rev-parse --short HEAD)"
    environment:
      CONFIG_REPO: ${CONFIG_REPO:-https://github.com/shahid25june/Caddy-Server.git}
      CONFIG_BRANCH: ${CONFIG_BRANCH:-main}
    volumes:
      - caddy-etc:/cfg
    restart: "no"

  caddy:
    image: caddy:2
    container_name: edge-caddy
    restart: unless-stopped
    # --watch re-reads the config (including config/sites/*.caddy) every second and applies
    # changes without a restart; a config with errors is logged and the running one is kept.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    depends_on:
      config:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-etc:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  edge:
    # Every app joins this network; it already exists on the server
    name: doclin-net
    external: true

volumes:
  caddy-etc:
  caddy-data:
  caddy-config:
